compliance_claims:
- claim: 'GDPR/SSAE16 Compliant'
  source: https://www.banqu.co/platform
  verified: false
  note: >-
    Stated as a platform feature bullet on BanQu's own marketing site. No trust center, no
    certification page, no attestation report, and no auditor is named; the privacy policy makes no
    certification claim. Recorded as a vendor claim, not as evidence of a published compliance
    program - which is why no `type: Compliance` pointer is wired in apis.yml.
- claim: 'Role-based permissions, security and optional auditor access'
  source: https://www.banqu.co/platform
  verified: partial
  note: >-
    The RBAC half is corroborated by the API - OrgRole, OrgCapabilities and Permissions model
    create/read/update/delete per capability, with GET /orgs/current/capabilities exposing the
    effective permission set.

regulatory_context:
  note: >-
    BanQu sells into regulated reporting regimes rather than being certified against them. Its
    product surface targets EU Deforestation Regulation (EUDR) due diligence, Extended Producer
    Responsibility, South African B-BBEE, GHG Protocol Scope 3 accounting, and lifecycle assessment.
    These are the customer's obligations that the platform produces evidence for; they are not
    conformance claims about the API itself.
  regimes: [EUDR, EPR, B-BBEE, GHG-Protocol-Scope-3, LCA]
