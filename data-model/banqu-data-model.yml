chain_of_custody:
  schema: ChainOfCustody
  note: >-
    The traceability primitive. GET /assets/{assetId}/sources and
    GET /transfers/{transferId}/sources walk a transfer back to the operations that supplied it, and
    AssetTransformationOperation records inputs being consumed into a new output asset - this is how
    a finished good is traced to the farms it came from.

geo:
  schemas: [GeoCoordinates, GeoJsonFeatureCollection, GeoJsonGeometryObject, EffectiveLocation]
  note: >-
    Locations are modelled as GeoJSON feature collections, which is what makes plot-level
    deforestation (EUDR) evidence expressible through the same API.
