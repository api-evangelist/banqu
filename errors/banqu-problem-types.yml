note: >-
  BanQu does not use RFC 9457 problem+json. The published OpenAPI declares a set of shared
  components.responses keyed by bare HTTP status code, each carrying only a human-readable
  description and no error schema, so an agent cannot bind to a machine-readable error body from
  the spec alone. The one observable error envelope is the platform's routing 404, confirmed live
  against https://api.banqu.app/ — {"message": "<path> endpoint does not exist", "url": "<path>"} —
  which suggests a {message, url} shape, but that shape is NOT declared in the spec and must not
  be assumed for application-level errors.

