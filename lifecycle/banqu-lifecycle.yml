    Resource lifecycle inside the API is unusually well defined even though the API's own lifecycle
    is not - assets, forms, form data entries, orgs, smart contracts, data processors, and
    validation workflows all support DELETE followed by a POST .../restore. See
    conventions/banqu-conventions.yml.

