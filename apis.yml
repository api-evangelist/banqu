    application host. Resource-oriented URLs, JSON in and out, HTTP verbs and status codes for errors, JWT
    bearer authentication with long-lived API tokens issued from /auth/api-tokens. 134 paths and 191
    operations across 25 tagged capability groups: Authentication, User Profile, User Profile Sharing,
    Public Profiles, Connections, Organizations, Organization Associates / Roles / Features, Assets, Asset
