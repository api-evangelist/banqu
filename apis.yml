aid: banqu
name: BanQu
description: >-
  BanQu is a Minnetonka, Minnesota supply-chain traceability and sustainability software company whose
  blockchain-backed (non-crypto, distributed-ledger) platform gives brands farm-to-shelf visibility across
  agriculture, recycling, apparel, beauty, and mining supply chains. The platform records assets, transfers,
  transactions, and supplier form data against verifiable identities for smallholder farmers, waste pickers,
  and other last-mile suppliers, and layers on compliance and reporting products for EUDR due diligence,
  Extended Producer Responsibility, B-BBEE, Scope 3 carbon accounting, lifecycle assessment, plastic and
  carbon credits, living income and wage, and anti-forced/child-labour screening. Its production REST API
  (OpenAPI 3.0.3, 134 paths / 191 operations, served live at https://banqu.app/api/v1/schema) covers
  authentication and API tokens, profiles and profile sharing, organizations, roles and capabilities,
  connections, assets and asset categories, transfers, transactions, transformations, payment adjustments,
  forms and form data entries, attachments, notifications, and three automation surfaces — Smart Contracts,
  Data Processors, and Validation Workflows.
